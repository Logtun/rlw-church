<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="logo.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Poster · RLW Birthdays · Rivers of Living Water Parish</title>
<style>
@page{size:A4 portrait;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#3a3d48;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.bar{max-width:210mm;margin:0 auto;padding:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bar button,.bar a{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;min-height:48px;background:#0A8F4A;color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.bar a{background:#1B2A6B}
.bar :focus-visible{outline:3px solid #8fd3ff;outline-offset:2px}
.sheet{width:210mm;height:297mm;margin:0 auto 24px;background:#fff;color:#0d0f16;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.4)}
.top{background:#000;color:#fff;text-align:center;padding:8mm 10mm 6mm}
.top img{width:42mm;height:auto;display:block;margin:0 auto}
.stripe{height:5mm;background:linear-gradient(90deg,#1B2A6B 0 50%,#0A8F4A 50% 100%)}
.body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8mm 14mm}
@font-face{font-family:"RLWScript";src:url(fonts/GreatVibes-Regular.woff2) format("woff2")}
.scr{font-family:"RLWScript",cursive;font-size:20mm;color:#b8860b;margin:0 0 1mm;line-height:1}
h1{font-family:Georgia,"Times New Roman",serif;font-size:17mm;line-height:1.05;margin:0 0 3mm;color:#1B2A6B}
.sub{font-size:9mm;font-weight:700;margin:0 0 8mm;color:#0d0f16}
#qr{width:86mm;height:86mm}
#qr svg{width:100%;height:100%;display:block}
.how{font-size:5.2mm;margin:6mm 0 1.5mm;color:#333}
.url{font-size:5.6mm;font-weight:700;color:#1B2A6B;word-break:break-all}
.foot{flex:none;background:#000;color:#fff;text-align:center;padding:6mm;font-size:4.6mm;letter-spacing:.02em}
@media screen and (max-width:820px){.sheet{zoom:.46}}
@media print{html,body{background:#fff}.bar{display:none}.sheet{margin:0;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<nav class="bar" aria-label="Poster actions"><button type="button" onclick="window.print()">Print poster (A4)</button><a href="admin">Admin page</a></nav>
<main class="sheet">
<div class="top"><img src="logo-lg.jpg" width="488" height="640" alt="RCCG Rivers of Living Water Parish logo"></div>
<div class="stripe" aria-hidden="true"></div>
<div class="body">
<p class="scr">Happy Birthday</p>
<h1>Add your birthday</h1>
<p class="sub">Scan to join the church birthday list</p>
<div id="qr" role="img" aria-label="QR code to the birthday register form"></div>
<p class="how">Point your phone camera at the code. Add your name, birthday (day and month) and a photo. We celebrate every member in their birthday month.</p>
<p class="url" id="url"></p>
</div>
<div class="foot">Rivers of Living Water Parish</div>
</main>
<script src="qrcode.js"></script>
<script src="poster.js?v=u1"></script>
</body>
</html>
