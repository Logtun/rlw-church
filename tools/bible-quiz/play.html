<!doctype html>
<html lang="en" data-theme-default="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join RLW Bible Quiz Night</title>
<meta name="description" content="Enter the game PIN and your name to play RLW Bible Quiz Night.">
<meta name="theme-color" content="#050505" data-dark="#050505" data-light="#f5f7fc">
<script>(function(){var r=document.documentElement,t;try{t=localStorage.getItem('rlw-theme')}catch(e){}if(t!=='dark'&&t!=='light'){try{t='dark'}catch(e){t='dark'}}r.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m){if(!m.hasAttribute('data-light'))m.setAttribute('data-light',m.getAttribute('content'));m.setAttribute('content',t==='dark'?(m.getAttribute('data-dark')||'#0E1116'):m.getAttribute('data-light'))}})()</script>
<meta property="og:title" content="Join RLW Bible Quiz Night">
<meta property="og:description" content="Enter the game PIN and your name to play RLW Bible Quiz Night.">
<meta property="og:image" content="https://rlw-bible-quiz.sites.tab.bot/og.png?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta property="og:site_name" content="RLW Bible Quiz Night">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css?v=rlw2p">
<link rel="stylesheet" href="theme.css?v=1">
<style>@media (max-width:600px){#joinForm,#joinForm input{text-align:center}#view .qtext,#view .autobar,#view .card>p[style^="margin-top:0;font-weight:700"]{text-align:center}}</style>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html"><img src="logo.png" alt="Rivers of Living Water Parish" height="40"><span class="q">Bible Quiz</span></a>
  <nav aria-label="Main"><a href="index.html">Join</a><a href="solo.html">Solo</a><a href="host.html">Host</a><a href="editor.html">Editor</a></nav>
<button type="button" class="rlw-tt" aria-label="Light mode" title="Light mode"></button>
</header>
<main id="main">

<div class="wrap-narrow" id="app" aria-live="polite">
  <form class="card join-box" id="joinForm" autocomplete="off">
    <h2>Join a game</h2>
    <div class="field"><label for="pin">Game PIN</label><input id="pin" class="pin-input" inputmode="numeric" maxlength="7" placeholder="123456" required></div>
    <div class="field"><label for="xh">Your name</label><input id="xh" maxlength="30" placeholder="e.g. Tolu A." autocomplete="given-name" enterkeyhint="go" required></div>
    <button class="btn primary big" type="submit" id="joinBtn">Join</button>
    <p class="err" id="joinErr" role="alert"></p>
  </form>
  <div id="view" class="hide"></div>
</div>

</main>
<footer><div>Rivers of Living Water Parish</div><div style="margin-top:6px;font-size:.85em;opacity:.8">© 2026 Rivers Of Living Water</div></footer>
<script src="theme.js?v=1"></script><script src="common.js?v=u1"></script><script src="sound.js?v=u1"></script><script src="card.js?v=u1"></script><script src="play.js?v=u1"></script>
</body>
</html>
