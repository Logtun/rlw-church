<script>(function(){var r=document.documentElement,t;try{t=localStorage.getItem('rlw-theme')}catch(e){}if(t!=='dark'&&t!=='light'){try{t='dark'}catch(e){t='dark'}}r.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m){if(!m.hasAttribute('data-light'))m.setAttribute('data-light',m.getAttribute('content'));m.setAttribute('content',t==='dark'?(m.getAttribute('data-dark')||'#0E1116'):m.getAttribute('data-light'))}})()</script>

    <h2>Host login</h2>
    <p class="muted">Only the quiz host can start games and edit questions.</p>
    <div class="field"><label for="pw">Host password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn primary big" type="submit">Log in</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
  <div id="view"></div>
</div>
