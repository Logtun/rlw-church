<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>RLW Youth Cave</title>
<meta name="description" content="The Youth Cave of RCCG Rivers of Living Water Parish. Members only.">
<meta name="theme-color" content="#1B2A6B">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css?v=13">
</head>
<body>
<div id="login" class="login" hidden>
  <main class="lcard" aria-labelledby="lh">
    <img src="logo-d.png" alt="Rivers of Living Water Parish logo" width="92" height="121">
    <p class="eyebrow">RCCG Rivers of Living Water Parish</p>
    <h1 id="lh">Youth Cave</h1>
    <p class="muted">For our youth members. Enter the password your Youth Exco gave you.</p>
    <form id="lform" autocomplete="on">
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required>
      <label class="show"><input type="checkbox" id="showpw"> Show password</label>
      <button class="btn pri wide" type="submit" id="lbtn">Enter the Youth Cave</button>
      <p class="err" id="lerr" role="alert"></p>
    </form>
  </main>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="tin">
      <img src="logo-d.png" alt="" width="30" height="39">
      <div class="tt"><b>Youth Cave</b><small id="roleLbl">Member</small></div>
      <button class="btn ghost sm" id="logout" type="button">Log out</button>
    </div>
    <nav class="tabs" aria-label="Youth Cave sections"><div class="tabin" id="tabs"></div></nav>
  </header>
  <main id="main" class="wrap" tabindex="-1"></main>
</div>

<footer class="foot">
  <p>Rivers of Living Water Parish</p>
  <p class="c">&copy; 2026 Rivers Of Living Water</p>
</footer>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mh">
    <div class="mhd"><h2 id="mh">Edit</h2><button type="button" class="x" id="mclose" aria-label="Close">Close</button></div>
    <form id="mform" novalidate></form>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js?v=13"></script>
</body>
</html>
